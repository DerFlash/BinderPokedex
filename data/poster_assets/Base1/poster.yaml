scope: Base1

layout:
  name: standard_3x3

text_cells:
  title:
    row: 1
    column: 2
  set_info:
    row: 2
    column: 2
    max_width_ratio: 0.92
    max_height_ratio: 0.68

title_logo:
  file: logo.png
  source: https://assets.tcgdex.net/en/base/base1/logo.png

pdf:
  enabled: true
  artwork_file: poster-flux2-artwork.png
  insertion: after_first_section_cover

pokemon:
  strategy: featured_from_scope
  count: auto_from_layout_columns
  row: bottom
  cutout_source: pokeapi_official_artwork
  fallback_candidates:
    - pokemon_id: 25   # Pikachu
    - pokemon_id: 7    # Squirtle / Schiggy
    - pokemon_id: 6    # Charizard / Glurak

conditioning:
  identity_defaults:
    neutral_rgb: [226, 224, 211]
    canvas_px: 512
    min_subject_px: 150
    max_subject_px: 350
    bottom_padding_px: 24
  subjects:
    150:
      composition:
        scale: 0.22
        x_offset_cell: -0.28
        baseline_offset_cell: 0.10
      identity:
        canvas_px: 768
        align_x: left
        x_padding_px: 24
      prompt_notes:
        - Leave generous clear landscape space above Mewtwo's head and to the right of its hand; it must occupy at most seventy percent of its region's height and width, and its rightmost fingertip must end before the final quarter of its region.
        - Copy the exact smooth head contour, short cranial nubs, three-digit hands, feet, and continuous tail curve without simplifying or redesigning them.

background:
  mode: generated
  file: background/background.png
  prompt_file: background/prompt.txt
  manifest_file: background/manifest.json
