scope: ExGen3
description: Modern Pokémon ex cards from TCGdex - one representative per exact visual form
pipeline:
- step: enrich_metadata
  params:
    metadata_file: enrichments/metadata.json
- step: validate_pokedex_exists
  params:
    pokedex_file: data/output/Pokedex.json
- step: load_ex_cards
  params:
    source_file: data/source/tcg_sv_ex.json
    context_key: tcg_sv_ex_cards
- step: fetch_tcgdex_ex_gen3
  params:
    language: en
    output_file: data/source/tcg_sv_ex.json
- step: transform_ex_gen3
- step: enrich_names_from_pokedex
  params:
    pokedex_file: data/output/Pokedex.json
    form_names_file: enrichments/card_form_names.json
- step: enrich_section_descriptions
  params:
    mode: variant
    variant_name: ExGen3
    descriptions_file: enrichments/variant_descriptions.json
- step: enrich_featured_elements
  params:
    max_cards: 3
    force: false
    cache_dir: data/section_artwork
    section_featured_card_ids:
      normal:
        - sv01-125
        - me02.5-057
        - sv01-081
      mega:
        - me01-100
        - me02.5-267
        - me02.5-113
- step: save_output
  params:
    output_file: data/output/ExGen3.json
- step: cache_pokemon_images
  params:
    skip_existing: true
target_file: data/output/ExGen3.json
