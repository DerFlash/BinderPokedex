name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release-candidate:
    uses: ./.github/workflows/build-release.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_notes_tag: ${{ github.ref_name }}
      artifact_retention_days: 7

  publish:
    name: Publish GitHub release
    needs: build-release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-candidate

      - name: Create Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Binder Pokédex ${{ github.ref_name }}
          files: |
            release-candidate/binder-pokedex-de.zip
            release-candidate/binder-pokedex-en.zip
            release-candidate/binder-pokedex-fr.zip
            release-candidate/binder-pokedex-es.zip
            release-candidate/binder-pokedex-it.zip
            release-candidate/binder-pokedex-ja.zip
            release-candidate/binder-pokedex-ko.zip
            release-candidate/binder-pokedex-zh_hans.zip
            release-candidate/binder-pokedex-zh_hant.zip
            release-candidate/release-manifest.json
          body_path: release-candidate/release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
